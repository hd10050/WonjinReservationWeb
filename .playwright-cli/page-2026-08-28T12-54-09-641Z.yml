        - heading "干细胞" [level=1] [ref=f113e37]
        - paragraph [ref=f113e38]: 干细胞是重新供应流失细胞的根源能量，修复受损脆弱的细胞，解决老化的根本原因，再生新生细胞的抗老治疗。逆转细胞生命力，重现年轻肌肤的高端手术。
      - generic [ref=f113e40]:
        - generic [ref=f113e42]:
          - heading "干细胞的功效范围" [level=2] [ref=f113e43]
          - paragraph [ref=f113e44]: 脱发、眼科、牙科、老化、美容·整形、再次手术（挛缩等）、腰椎间盘、颈椎间盘、疼痛、关节、软骨再生、性功能、慢性疲劳、特应性皮炎等皮肤疾病、更年期。
        - generic [ref=f113e46]:
          - generic [ref=f113e47]:
            - heading "抗衰老 (Antiaging)" [level=3] [ref=f113e48]
            - paragraph [ref=f113e49]: 诱导减少氧化应激物质，降低线粒体基因组损伤，增加抗衰老激素与蛋白质的含量。
          - generic [ref=f113e50]:
            - heading "归巢效应 (Homing Effect)" [level=3] [ref=f113e51]
            - paragraph [ref=f113e52]: 自行侦测并修复受损组织，更新全身细胞与组织，显著改善身体的整体问题。
          - generic [ref=f113e53]:
            - heading "胶原蛋白·弹力蛋白细胞再生" [level=3] [ref=f113e54]
            - paragraph [ref=f113e55]: 再生因老化而减少的组织，促进恢复，改善弹力与气色、提拉等，将肌肤状态修复至最佳。
          - generic [ref=f113e56]:
            - heading "改善免疫·代谢·状态" [level=3] [ref=f113e57]
            - paragraph [ref=f113e58]: 激活低下的细胞功能，将代谢提升至末梢细胞，恢复身体所有器官与功能。
        - generic [ref=f113e60]:
          - heading "以科学而非感性打造" [level=2] [ref=f113e61]
          - paragraph [ref=f113e62]: WJ原辰不仅运营自有干细胞研究所，还以与专业研究机构的技术合作为基础，提供安全的高效能干细胞治疗。
        - generic [ref=f113e64]:
          - generic [ref=f113e65]:
            - heading "安全且经过验证的治疗" [level=3] [ref=f113e66]
            - paragraph [ref=f113e67]: 凭借研发专属部门认证及先进的干细胞系统与设备，无需担心免疫排斥反应与副作用，治疗见效快、满意度高。
          - generic [ref=f113e68]:
