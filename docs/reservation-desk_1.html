<title>실장 예약 데스크</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=Noto+Sans+TC:wght@400;500&family=Noto+Serif+KR:wght@600&family=IBM+Plex+Mono:wght@400;500&display=swap">

<style>
  :root {
    --ground: #EAEEEC;
    --surface: #FFFFFF;
    --surface-2: #F4F7F5;
    --ink: #14201D;
    --ink-2: #3D4E49;
    --muted: #6B7B76;
    --line: #D5DEDA;
    --line-soft: #E4EAE7;
    --accent: #0B6152;
    --accent-ink: #FFFFFF;
    --accent-soft: #DDEEE9;

    --s-new: #A34818;
    --s-new-bg: #F8E9DF;
    --s-talk: #1B577E;
    --s-talk-bg: #E0EBF3;
    --s-fix: #0B6152;
    --s-fix-bg: #DDEEE9;
    --s-done: #5A6A65;
    --s-done-bg: #E7EBE9;
    --s-cancel: #8C3A2E;
    --s-cancel-bg: #F5E2DF;

    --shadow: 0 1px 2px rgba(20, 32, 29, .06), 0 8px 24px -12px rgba(20, 32, 29, .18);
    --radius: 10px;

    --sans: "Noto Sans KR", "Noto Sans TC", system-ui, sans-serif;
    --sans-zh: "Noto Sans TC", "Noto Sans KR", system-ui, sans-serif;
    --serif: "Noto Serif KR", Georgia, serif;
    --mono: "IBM Plex Mono", ui-monospace, monospace;
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --ground: #0E1513;
      --surface: #161F1C;
      --surface-2: #1C2724;
      --ink: #E6EDEA;
      --ink-2: #C0CCC8;
      --muted: #8B9A95;
      --line: #2A3733;
      --line-soft: #222E2A;
      --accent: #3FAE95;
      --accent-ink: #08201B;
      --accent-soft: #16302A;

      --s-new: #E0955F;
      --s-new-bg: #33231A;
      --s-talk: #7FB6DC;
      --s-talk-bg: #17262F;
      --s-fix: #4FBBA2;
      --s-fix-bg: #16302A;
      --s-done: #9AA9A4;
      --s-done-bg: #212B28;
      --s-cancel: #DE9086;
      --s-cancel-bg: #33211E;

      --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 10px 28px -14px rgba(0, 0, 0, .7);
    }
  }

  :root[data-theme="dark"] {
    --ground: #0E1513;
    --surface: #161F1C;
    --surface-2: #1C2724;
    --ink: #E6EDEA;
    --ink-2: #C0CCC8;
    --muted: #8B9A95;
    --line: #2A3733;
    --line-soft: #222E2A;
    --accent: #3FAE95;
    --accent-ink: #08201B;
    --accent-soft: #16302A;

    --s-new: #E0955F;
    --s-new-bg: #33231A;
    --s-talk: #7FB6DC;
    --s-talk-bg: #17262F;
    --s-fix: #4FBBA2;
    --s-fix-bg: #16302A;
    --s-done: #9AA9A4;
    --s-done-bg: #212B28;
    --s-cancel: #DE9086;
    --s-cancel-bg: #33211E;

    --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 10px 28px -14px rgba(0, 0, 0, .7);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--ground);
    color: var(--ink);
    font-family: var(--sans);
    font-size: 14px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }

  .zh { font-family: var(--sans-zh); }

  .shell {
    max-width: 1320px;
    margin: 0 auto;
    padding: 20px 20px 56px;
    display: flex;
    flex-direction: column;
    gap: 18px;
  }

  /* ---------- header ---------- */
  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    flex-wrap: wrap;
    padding-bottom: 14px;
    border-bottom: 1px solid var(--line);
  }

  .brand { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }

  .brand h1 {
    font-family: var(--serif);
    font-weight: 600;
    font-size: 21px;
    letter-spacing: -.01em;
    margin: 0;
  }

  .brand .sub {
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: .1em;
    text-transform: uppercase;
    color: var(--muted);
  }

  .topbar-right { display: flex; align-items: center; gap: 10px; }

  .whoami {
    display: flex;
    align-items: center;
    gap: 9px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 5px 13px 5px 5px;
  }

  .whoami .avatar {
    width: 26px; height: 26px;
    border-radius: 50%;
    background: var(--accent);
    color: var(--accent-ink);
    display: grid; place-items: center;
    font-size: 12px; font-weight: 700;
  }

  .whoami .name { font-size: 13px; font-weight: 500; }
  .whoami .role { font-size: 11px; color: var(--muted); font-family: var(--mono); }

  .clock {
    font-family: var(--mono);
    font-size: 12px;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
  }

  /* ---------- stats ---------- */
  .stats {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 12px;
  }

  .stat {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 13px 15px;
    display: flex;
    flex-direction: column;
    gap: 3px;
    position: relative;
    overflow: hidden;
  }

  .stat::before {
    content: "";
    position: absolute;
    inset: 0 auto 0 0;
    width: 3px;
    background: var(--stat-color, var(--line));
  }

  .stat .label {
    font-size: 11px;
    font-family: var(--mono);
    letter-spacing: .06em;
    color: var(--muted);
    text-transform: uppercase;
  }

  .stat .label-zh { font-size: 11px; color: var(--muted); }

  .stat .value {
    font-size: 27px;
    font-weight: 700;
    line-height: 1.1;
    font-variant-numeric: tabular-nums;
    color: var(--stat-color, var(--ink));
  }

  .stat .value .unit { font-size: 13px; font-weight: 500; color: var(--muted); margin-left: 3px; }

  /* ---------- workspace ---------- */
  .work {
    display: grid;
    grid-template-columns: minmax(320px, 400px) 1fr;
    gap: 16px;
    align-items: start;
  }

  .panel {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
  }

  .panel-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    padding: 13px 15px;
    border-bottom: 1px solid var(--line-soft);
  }

  .panel-head h2 {
    margin: 0;
    font-size: 14px;
    font-weight: 700;
    display: flex;
    align-items: baseline;
    gap: 7px;
  }

  .panel-head h2 .zh { font-size: 12px; font-weight: 400; color: var(--muted); }

  .count-chip {
    font-family: var(--mono);
    font-size: 11px;
    background: var(--surface-2);
    border: 1px solid var(--line-soft);
    color: var(--muted);
    border-radius: 999px;
    padding: 2px 8px;
    font-variant-numeric: tabular-nums;
  }

  /* ---------- queue ---------- */
  .queue-tools {
    padding: 11px 15px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    border-bottom: 1px solid var(--line-soft);
  }

  .search {
    display: flex;
    align-items: center;
    gap: 8px;
    background: var(--surface-2);
    border: 1px solid var(--line-soft);
    border-radius: 8px;
    padding: 7px 10px;
  }

  .search svg { flex: none; opacity: .55; }

  .search input {
    border: 0;
    background: transparent;
    color: var(--ink);
    font: inherit;
    width: 100%;
    outline: none;
  }

  .search input::placeholder { color: var(--muted); }

  .filters { display: flex; gap: 6px; flex-wrap: wrap; }

  .chip {
    font: inherit;
    font-size: 12px;
    padding: 4px 10px;
    border-radius: 999px;
    border: 1px solid var(--line);
    background: var(--surface);
    color: var(--ink-2);
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 5px;
  }

  .chip .n { font-family: var(--mono); font-size: 11px; opacity: .7; font-variant-numeric: tabular-nums; }
  .chip:hover { border-color: var(--accent); color: var(--accent); }
  .chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  .chip[aria-pressed="true"] .n { opacity: .85; }

  .queue {
    list-style: none;
    margin: 0;
    padding: 6px;
    max-height: 620px;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 5px;
  }

  .card {
    width: 100%;
    text-align: left;
    font: inherit;
    color: var(--ink);
    background: transparent;
    border: 1px solid transparent;
    border-radius: 8px;
    padding: 11px 12px 11px 14px;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    gap: 7px;
    position: relative;
  }

  .card::before {
    content: "";
    position: absolute;
    left: 5px; top: 12px; bottom: 12px;
    width: 3px;
    border-radius: 2px;
    background: var(--st);
  }

  .card:hover { background: var(--surface-2); }
  .card[aria-current="true"] { background: var(--accent-soft); border-color: var(--accent); }
  .card:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

  .card-row1 { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }

  .card .who { display: flex; align-items: baseline; gap: 6px; min-width: 0; }
  .card .who b { font-size: 14px; font-weight: 700; }
  .card .who .meta { font-size: 12px; color: var(--muted); white-space: nowrap; }

  .pill {
    font-size: 11px;
    font-weight: 500;
    padding: 2px 8px;
    border-radius: 999px;
    white-space: nowrap;
    background: var(--st-bg);
    color: var(--st);
  }

  .card-row2 { display: flex; align-items: center; justify-content: space-between; gap: 8px; }

  .src {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    font-size: 11.5px;
    color: var(--ink-2);
    background: var(--surface-2);
    border: 1px solid var(--line-soft);
    border-radius: 5px;
    padding: 1px 7px;
    max-width: 100%;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .card[aria-current="true"] .src { background: var(--surface); }

  .when {
    font-family: var(--mono);
    font-size: 11.5px;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }

  /* ---------- detail ---------- */
  .detail-head {
    padding: 16px 20px;
    border-bottom: 1px solid var(--line-soft);
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 14px;
    flex-wrap: wrap;
  }

  .detail-name { display: flex; align-items: baseline; gap: 9px; flex-wrap: wrap; }
  .detail-name h3 { margin: 0; font-size: 20px; font-weight: 700; letter-spacing: -.01em; }
  .detail-name .zh-name { font-size: 15px; color: var(--muted); }
  .detail-id { font-family: var(--mono); font-size: 11.5px; color: var(--muted); letter-spacing: .04em; }

  .facts {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
    gap: 1px;
    background: var(--line-soft);
    border-top: 1px solid var(--line-soft);
    border-bottom: 1px solid var(--line-soft);
  }

  .fact { background: var(--surface); padding: 12px 20px; display: flex; flex-direction: column; gap: 2px; }

  .fact dt {
    font-size: 10.5px;
    font-family: var(--mono);
    letter-spacing: .07em;
    text-transform: uppercase;
    color: var(--muted);
  }

  .fact dt .zh { font-family: var(--sans-zh); letter-spacing: 0; text-transform: none; white-space: nowrap; }
  .fact dd { margin: 0; font-size: 14px; font-weight: 500; }
  .fact dd.mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }

  .form { padding: 18px 20px 20px; display: flex; flex-direction: column; gap: 18px; }

  .section-title {
    display: flex;
    align-items: baseline;
    gap: 8px;
    padding-bottom: 7px;
    border-bottom: 1px solid var(--line-soft);
    margin-bottom: 12px;
  }

  .section-title h4 { margin: 0; font-size: 13px; font-weight: 700; }
  .section-title .zh { font-size: 11.5px; color: var(--muted); }

  .field { display: flex; flex-direction: column; gap: 6px; }

  .field > label, .field > .lab {
    font-size: 12px;
    font-weight: 500;
    display: flex;
    align-items: baseline;
    gap: 6px;
  }

  .field > label .zh, .field > .lab .zh { font-size: 11px; color: var(--muted); font-weight: 400; }

  input[type="text"], input[type="date"], input[type="time"], input[type="number"], select, textarea {
    font: inherit;
    color: var(--ink);
    background: var(--surface-2);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 8px 10px;
    width: 100%;
    outline: none;
  }

  textarea { resize: vertical; min-height: 92px; line-height: 1.6; }

  input:focus, select:focus, textarea:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-soft);
  }

  .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }

  .toggles { display: flex; flex-wrap: wrap; gap: 6px; }

  .toggle input { position: absolute; opacity: 0; pointer-events: none; }

  .toggle span {
    display: inline-block;
    font-size: 12.5px;
    padding: 5px 11px;
    border: 1px solid var(--line);
    border-radius: 7px;
    cursor: pointer;
    background: var(--surface);
    user-select: none;
  }

  .toggle input:checked + span { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  .toggle input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: 2px; }
  .toggle span:hover { border-color: var(--accent); }
  .toggle input:checked + span:hover { border-color: var(--accent); }

  .pay {
    display: flex;
    align-items: center;
    gap: 12px;
    background: var(--surface-2);
    border: 1px solid var(--line-soft);
    border-radius: 8px;
    padding: 11px 13px;
    flex-wrap: wrap;
  }

  .pay .amount { display: flex; align-items: center; gap: 7px; }
  .pay .amount input { width: 130px; font-family: var(--mono); font-variant-numeric: tabular-nums; }
  .pay .cur { font-family: var(--mono); font-size: 12px; color: var(--muted); }

  .switch { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; font-size: 12.5px; }
  .switch input { position: absolute; opacity: 0; pointer-events: none; }

  .switch .track {
    width: 38px; height: 21px;
    border-radius: 999px;
    background: var(--line);
    position: relative;
    transition: background .18s ease;
    flex: none;
  }

  .switch .track::after {
    content: "";
    position: absolute;
    top: 2px; left: 2px;
    width: 17px; height: 17px;
    border-radius: 50%;
    background: var(--surface);
    transition: transform .18s ease;
    box-shadow: 0 1px 2px rgba(0, 0, 0, .25);
  }

  .switch input:checked + .track { background: var(--accent); }
  .switch input:checked + .track::after { transform: translateX(17px); }
  .switch input:focus-visible + .track { outline: 2px solid var(--accent); outline-offset: 2px; }

  .log { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 0; }

  .log li {
    display: grid;
    grid-template-columns: 82px 1fr;
    gap: 12px;
    padding: 9px 0;
    border-bottom: 1px dashed var(--line-soft);
    font-size: 12.5px;
  }

  .log li:last-child { border-bottom: 0; }
  .log time { font-family: var(--mono); font-size: 11.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .log .by { color: var(--muted); }

  .actions {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding-top: 4px;
    flex-wrap: wrap;
  }

  .hint { font-size: 11.5px; color: var(--muted); }

  .btn-row { display: flex; gap: 8px; }

  button.btn {
    font: inherit;
    font-size: 13px;
    font-weight: 500;
    border-radius: 8px;
    padding: 9px 16px;
    cursor: pointer;
    border: 1px solid var(--line);
    background: var(--surface);
    color: var(--ink);
  }

  button.btn:hover { border-color: var(--accent); color: var(--accent); }

  button.btn.primary {
    background: var(--accent);
    border-color: var(--accent);
    color: var(--accent-ink);
  }

  button.btn.primary:hover { filter: brightness(1.07); color: var(--accent-ink); }
  button.btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .empty { padding: 60px 20px; text-align: center; color: var(--muted); font-size: 13px; }

  .toast {
    position: fixed;
    left: 50%;
    bottom: 26px;
    transform: translate(-50%, 18px);
    background: var(--ink);
    color: var(--ground);
    border-radius: 999px;
    padding: 9px 18px;
    font-size: 13px;
    box-shadow: var(--shadow);
    opacity: 0;
    pointer-events: none;
    transition: opacity .2s ease, transform .2s ease;
    z-index: 40;
  }

  .toast.show { opacity: 1; transform: translate(-50%, 0); }

  .foot {
    font-size: 11.5px;
    color: var(--muted);
    text-align: center;
    padding-top: 6px;
  }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; animation: none !important; }
  }

  @media (max-width: 1000px) {
    .work { grid-template-columns: 1fr; }
    .queue { max-height: 340px; }
    .stats { grid-template-columns: repeat(2, 1fr); }
  }

  @media (max-width: 640px) {
    .grid-2, .grid-3 { grid-template-columns: 1fr; }
    .shell { padding: 14px 13px 40px; }
  }
</style>

<div class="shell">
  <header class="topbar">
    <div class="brand">
      <h1>실장 예약 데스크</h1>
      <span class="sub zh">室長 預約管理台 · WJ SYSTEM</span>
    </div>
    <div class="topbar-right">
      <span class="clock" id="clock">2026-08-25 (火) 14:20 KST</span>
      <div class="whoami">
        <span class="avatar">김</span>
        <span>
          <span class="name">김수진</span>
          <span class="role">室長 / A팀</span>
        </span>
      </div>
    </div>
  </header>

  <section class="stats" aria-label="오늘 현황 今日概況">
    <div class="stat" style="--stat-color: var(--s-new)">
      <span class="label">신규 접수</span>
      <span class="label-zh zh">新預約 · 未聯絡</span>
      <span class="value" id="stat-new">0<span class="unit">건</span></span>
    </div>
    <div class="stat" style="--stat-color: var(--s-talk)">
      <span class="label">상담 진행중</span>
      <span class="label-zh zh">咨詢中</span>
      <span class="value" id="stat-talk">0<span class="unit">건</span></span>
    </div>
    <div class="stat" style="--stat-color: var(--s-fix)">
      <span class="label">예약 확정</span>
      <span class="label-zh zh">預約確定 · 已收訂金</span>
      <span class="value" id="stat-fix">0<span class="unit">건</span></span>
    </div>
    <div class="stat">
      <span class="label">이번 달 방문 완료</span>
      <span class="label-zh zh">本月來訪完成</span>
      <span class="value" id="stat-done">0<span class="unit">건</span></span>
    </div>
  </section>

  <div class="work">
    <!-- ============ QUEUE ============ -->
    <section class="panel" aria-label="예약 목록 預約列表">
      <div class="panel-head">
        <h2>들어온 예약 <span class="zh">收到的預約</span></h2>
        <span class="count-chip" id="queue-count">0</span>
      </div>

      <div class="queue-tools">
        <div class="search">
          <svg width="14" height="14" viewBox="0 0 16 16" fill="none" aria-hidden="true">
            <circle cx="7" cy="7" r="4.6" stroke="currentColor" stroke-width="1.5"></circle>
            <path d="M10.5 10.5 14 14" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"></path>
          </svg>
          <input id="search" type="text" placeholder="이름 · 위챗ID · 인플루언서 검색 / 搜尋" aria-label="예약 검색">
        </div>
        <div class="filters" id="filters" role="group" aria-label="상태 필터"></div>
      </div>

      <ul class="queue" id="queue"></ul>
    </section>

    <!-- ============ DETAIL ============ -->

    var changed = next !== r.status;
    r.status = next;

    r.log.push({ t: "지금", ko: "상담 내용 저장", zh: "儲存咨詢內容", by: r.manager });
    if (changed && next === "fixed") {
      r.log.push({ t: "지금", ko: "예약금 확인 · 예약 확정", zh: "確認訂金 · 預約確定", by: r.manager });
    }

    renderAll();
    toast(changed
      ? "저장 완료 — 상태가 <b>예약 확정</b>으로 변경되었습니다 · 已儲存"
      : "상담 내용을 저장했습니다 · 已儲存");
  });

  renderAll();
})();
</script>
